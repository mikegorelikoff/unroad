<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="From idea to agent: an idea, a PR/FAQ that tests the customer value, a one-page spec with rules and non-goals, numbered acceptance criteria, small vertical slices, and a readiness gate before an agent builds against the criteria. A gap found at the gate goes back into the spec. Deciding before code costs a sentence; deciding after costs a rewrite.">
  <title>From idea to agent: an idea, a PR/FAQ that tests the customer value, a one-page spec with rules and non-goals, numbered acceptance criteria, small vertical slices, and a readiness gate before an agent builds against the criteria. A gap found at the gate goes back into the spec. Deciding before code costs a sentence; deciding after costs a rewrite.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="470" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">Decide before the agent builds</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">Each step removes a kind of guess the agent would otherwise make.</text>
  <rect x="48" y="136" width="132" height="156" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="64" y="170" font-size="17" fill="#FAFAF9" font-weight="600">Idea</text>
  <text x="64" y="202" font-size="15" fill="#A1A1AA">who has</text>
  <text x="64" y="222" font-size="15" fill="#A1A1AA">which problem</text>
  <path d="M182 214.0 H207" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="210" y="136" width="132" height="156" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="226" y="170" font-size="17" fill="#FAFAF9" font-weight="600">PR/FAQ</text>
  <text x="226" y="202" font-size="15" fill="#A1A1AA">the customer</text>
  <text x="226" y="222" font-size="15" fill="#A1A1AA">value first</text>
  <path d="M344 214.0 H369" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="372" y="136" width="132" height="156" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="388" y="170" font-size="17" fill="#FAFAF9" font-weight="600">Spec</text>
  <text x="388" y="202" font-size="15" fill="#A1A1AA">rules R1, R2,</text>
  <text x="388" y="222" font-size="15" fill="#A1A1AA">non-goals</text>
  <path d="M506 214.0 H531" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="534" y="136" width="132" height="156" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="550" y="170" font-size="17" fill="#FAFAF9" font-weight="600">Acceptance</text>
  <text x="550" y="192" font-size="17" fill="#FAFAF9" font-weight="600">criteria</text>
  <text x="550" y="224" font-size="15" fill="#A1A1AA">AC1, AC2:</text>
  <text x="550" y="244" font-size="15" fill="#A1A1AA">trigger and</text>
  <text x="550" y="264" font-size="15" fill="#A1A1AA">result</text>
  <path d="M668 214.0 H693" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="696" y="136" width="132" height="156" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="712" y="170" font-size="17" fill="#FAFAF9" font-weight="600">Slices</text>
  <text x="712" y="202" font-size="15" fill="#A1A1AA">one session,</text>
  <text x="712" y="222" font-size="15" fill="#A1A1AA">one pull</text>
  <text x="712" y="242" font-size="15" fill="#A1A1AA">request</text>
  <path d="M830 214.0 H855" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="858" y="136" width="132" height="156" rx="12" fill="#2A1608" stroke="#F97316" stroke-width="2"/>
  <text x="874" y="170" font-size="17" fill="#FAFAF9" font-weight="600">Readiness</text>
  <text x="874" y="192" font-size="17" fill="#FAFAF9" font-weight="600">gate</text>
  <text x="874" y="224" font-size="15" fill="#A1A1AA">what would</text>
  <text x="874" y="244" font-size="15" fill="#A1A1AA">the agent</text>
  <text x="874" y="264" font-size="15" fill="#A1A1AA">guess?</text>
  <path d="M992 214.0 H1017" fill="none" stroke="#4CC9A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-pass_)"/>
  <rect x="1020" y="136" width="132" height="156" rx="12" fill="#FAFAF9"/>
  <text x="1036" y="170" font-size="17" fill="#0B0B0C" font-weight="600">Agent</text>
  <text x="1036" y="202" font-size="15" fill="#5C5E64">builds</text>
  <text x="1036" y="222" font-size="15" fill="#5C5E64">against the</text>
  <text x="1036" y="242" font-size="15" fill="#5C5E64">criteria</text>
  <path d="M924.0 296 V326 H438.0 V295" fill="none" stroke="#F27A7F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-fail)"/>
  <text x="681.0" y="350" font-size="15" fill="#F27A7F" font-weight="600" text-anchor="middle">a gap found: fix it in the spec, not in the code</text>
  <path d="M48 392 H1152" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="392" r="6" fill="#F97316"/>
  <circle cx="1152" cy="392" r="6" fill="#F27A7F"/>
  <text x="48" y="424" font-size="15" fill="#FB923C" font-weight="600">Before code: changing your mind costs a sentence</text>
  <text x="1152" y="424" font-size="15" fill="#F27A7F" font-weight="600" text-anchor="end">After code: a review, a rework, a rewrite</text>
  </g>
</svg>

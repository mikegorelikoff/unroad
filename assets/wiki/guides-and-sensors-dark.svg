<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Guides and sensors around an agent. Guides act before the agent does, to raise the odds of a good first attempt: computational ones such as generators, codemods and templates, inferential ones such as AGENTS.md, specs and skills. Sensors act after, so the agent notices a bad attempt and fixes it: computational ones such as tests, the type checker and the linter, inferential ones such as AI review and human review. Sensors work best close to the agent: a hook in seconds, pre-commit in minutes, CI after the push.">
  <title>Guides and sensors around an agent. Guides act before the agent does, to raise the odds of a good first attempt: computational ones such as generators, codemods and templates, inferential ones such as AGENTS.md, specs and skills. Sensors act after, so the agent notices a bad attempt and fixes it: computational ones such as tests, the type checker and the linter, inferential ones such as AI review and human review. Sensors work best close to the agent: a hook in seconds, pre-commit in minutes, CI after the push.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="540" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">Guides before, sensors after</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">Feedforward raises the odds of a good first attempt. Feedback catches the rest.</text>
  <rect x="48" y="124" width="360" height="272" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="72" y="162" font-size="21" fill="#FAFAF9" font-weight="600">Guides</text>
  <text x="72" y="188" font-size="15" fill="#A1A1AA">before the agent acts</text>
  <text x="72" y="226" font-size="15" fill="#A1A1AA">Computational</text>
  <rect x="72" y="240" width="98" height="28" rx="8" fill="#2A1608"/>
  <text x="84" y="259.25" font-size="15" fill="#FB923C">generators</text>
  <rect x="180" y="240" width="94" height="28" rx="8" fill="#2A1608"/>
  <text x="192" y="259.25" font-size="15" fill="#FB923C">codemods</text>
  <rect x="284" y="240" width="93" height="28" rx="8" fill="#2A1608"/>
  <text x="296" y="259.25" font-size="15" fill="#FB923C">templates</text>
  <text x="72" y="312" font-size="15" fill="#A1A1AA">Inferential</text>
  <rect x="72" y="326" width="105" height="28" rx="8" fill="#2A1608"/>
  <text x="84" y="345.25" font-size="15" fill="#FB923C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">AGENTS.md</text>
  <rect x="187" y="326" width="65" height="28" rx="8" fill="#2A1608"/>
  <text x="199" y="345.25" font-size="15" fill="#FB923C">specs</text>
  <rect x="262" y="326" width="60" height="28" rx="8" fill="#2A1608"/>
  <text x="274" y="345.25" font-size="15" fill="#FB923C">skills</text>
  <rect x="792" y="124" width="360" height="272" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="816" y="162" font-size="21" fill="#FAFAF9" font-weight="600">Sensors</text>
  <text x="816" y="188" font-size="15" fill="#A1A1AA">after the agent acts</text>
  <text x="816" y="226" font-size="15" fill="#A1A1AA">Computational</text>
  <rect x="816" y="240" width="60" height="28" rx="8" fill="#0E241E"/>
  <text x="828" y="259.25" font-size="15" fill="#4CC9A0">tests</text>
  <rect x="886" y="240" width="113" height="28" rx="8" fill="#0E241E"/>
  <text x="898" y="259.25" font-size="15" fill="#4CC9A0">type checker</text>
  <rect x="1009" y="240" width="59" height="28" rx="8" fill="#0E241E"/>
  <text x="1021" y="259.25" font-size="15" fill="#4CC9A0">linter</text>
  <text x="816" y="312" font-size="15" fill="#A1A1AA">Inferential</text>
  <rect x="816" y="326" width="89" height="28" rx="8" fill="#0E241E"/>
  <text x="828" y="345.25" font-size="15" fill="#4CC9A0">AI review</text>
  <rect x="915" y="326" width="121" height="28" rx="8" fill="#0E241E"/>
  <text x="927" y="345.25" font-size="15" fill="#4CC9A0">human review</text>
  <rect x="516" y="198.0" width="168" height="124" rx="14" fill="#FAFAF9"/>
  <text x="600.0" y="254.0" font-size="21" fill="#0B0B0C" font-weight="600" text-anchor="middle">Agent</text>
  <text x="600.0" y="280.0" font-size="15" fill="#5C5E64" text-anchor="middle">acts</text>
  <path d="M412 260.0 H513" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
  <text x="462.0" y="248.0" font-size="15" fill="#FB923C" font-weight="600" text-anchor="middle">feedforward</text>
  <path d="M688 238.0 H789" fill="none" stroke="#FAFAF9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
  <text x="738.0" y="226.0" font-size="15" fill="#A1A1AA" text-anchor="middle">output</text>
  <path d="M792 284.0 H687" fill="none" stroke="#4CC9A0" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-pass_)"/>
  <text x="738.0" y="308.0" font-size="15" fill="#4CC9A0" font-weight="600" text-anchor="middle">feedback</text>
  <text x="48" y="440" font-size="16" fill="#FAFAF9" font-weight="600">Put each sensor as close to the agent as it can afford</text>
  <path d="M56 472 H1144" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="472" r="7" fill="#4CC9A0"/>
  <text x="48" y="506" font-size="15" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">hook</text>
  <text x="96.0" y="506" font-size="15" fill="#A1A1AA">seconds after the edit</text>
  <circle cx="436" cy="472" r="7" fill="#141416" stroke="#A1A1AA" stroke-width="1.5"/>
  <text x="428" y="506" font-size="15" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">pre-commit</text>
  <text x="530.0" y="506" font-size="15" fill="#A1A1AA">minutes later, at commit</text>
  <circle cx="816" cy="472" r="7" fill="#141416" stroke="#A1A1AA" stroke-width="1.5"/>
  <text x="808" y="506" font-size="15" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">CI</text>
  <text x="838.0" y="506" font-size="15" fill="#A1A1AA">after the push</text>
  <text x="1144" y="506" font-size="15" fill="#A1A1AA" text-anchor="end">farther: slower</text>
  </g>
</svg>

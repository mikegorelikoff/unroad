<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="The context window is a fixed budget. Every request carries the system prompt, tool definitions and instruction files, which are always loaded and paid for on every turn, then the conversation, every file read and command output, and your newest message, which accumulate. When the window fills, the harness compacts it and details are lost. Attention is spread across everything in the window, so a rule that stood out in a fresh session is one line among thousands later.">
  <title>The context window is a fixed budget. Every request carries the system prompt, tool definitions and instruction files, which are always loaded and paid for on every turn, then the conversation, every file read and command output, and your newest message, which accumulate. When the window fills, the harness compacts it and details are lost. Attention is spread across everything in the window, so a rule that stood out in a fresh session is one line among thousands later.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C5E64"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F7A5F"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3263A"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C4C4BE"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B0B0C"/></marker></defs>
  <rect width="1200" height="560" fill="#FAFAF9"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#0B0B0C" font-weight="600" letter-spacing="-0.4">The context window is a budget</text>
  <text x="48" y="88" font-size="17" fill="#5C5E64">Everything the model knows on this turn is in one fixed-size window.</text>
  <rect x="48" y="196" width="1104" height="64" rx="12" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <rect x="52" y="202" width="124" height="52" rx="7" fill="#C4C4BE" opacity="0.55"/>
  <path d="M58 190 V174" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="58" y="166" font-size="15" fill="#0B0B0C" font-weight="600">System prompt</text>
  <rect x="182" y="202" width="144" height="52" rx="7" fill="#C4C4BE" opacity="0.55"/>
  <path d="M188 190 V174" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="188" y="166" font-size="15" fill="#0B0B0C" font-weight="600">Tool definitions</text>
  <rect x="332" y="202" width="144" height="52" rx="7" fill="#C4C4BE" opacity="0.55"/>
  <rect x="420" y="202" width="5" height="52" rx="1" fill="#F97316"/>
  <path d="M422.5 266 V282" fill="none" stroke="#F97316" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="412" y="300" font-size="15" fill="#C2410C" font-weight="600">a rule</text>
  <path d="M338 190 V174" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="338" y="166" font-size="15" fill="#0B0B0C" font-weight="600">Instruction files</text>
  <rect x="482" y="202" width="164" height="52" rx="7" fill="#5C5E64" opacity="0.45"/>
  <path d="M488 266 V282" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="488" y="300" font-size="15" fill="#0B0B0C" font-weight="600">Conversation</text>
  <rect x="652" y="202" width="294" height="52" rx="7" fill="#5C5E64" opacity="0.45"/>
  <path d="M658 266 V282" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="300" font-size="15" fill="#0B0B0C" font-weight="600">Files read, command output</text>
  <rect x="952" y="202" width="48" height="52" rx="7" fill="#5C5E64" opacity="0.8"/>
  <path d="M958 266 V282" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="958" y="300" font-size="15" fill="#0B0B0C" font-weight="600">Newest message</text>
  <text x="1026" y="235" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">free</text>
  <path d="M48 136 H478" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="126" font-size="15" fill="#5C5E64">Always loaded: paid again on every turn</text>
  <path d="M478 320 H1002" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="478" y="342" font-size="15" fill="#5C5E64">Accumulates: stays until you clear or compact</text>
  <path d="M1150 166 V290" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1140" y="166" font-size="15" fill="#C2410C" font-weight="600" text-anchor="end">limit: the harness compacts,</text>
  <text x="1140" y="186" font-size="15" fill="#C2410C" font-weight="600" text-anchor="end">details are lost</text>
  <text x="48" y="392" font-size="18" fill="#0B0B0C" font-weight="600">Attention is spread across everything in the window</text>
  <text x="48" y="418" font-size="15" fill="#5C5E64">The same rule, “never edit src/gen/”, early in a session and three hours later.</text>
  <text x="48" y="462" font-size="15" fill="#0B0B0C" font-weight="600">Fresh session</text>
  <rect x="198" y="444" width="378" height="28" rx="8" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <rect x="202" y="448" width="112" height="20" rx="5" fill="#5C5E64" opacity="0.35"/>
  <rect x="242" y="448" width="34" height="20" rx="4" fill="#F97316"/>
  <text x="198" y="500" font-size="15" fill="#C2410C">the rule stands out</text>
  <text x="624" y="462" font-size="15" fill="#0B0B0C" font-weight="600">Three hours later</text>
  <rect x="774" y="444" width="378" height="28" rx="8" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <rect x="778" y="448" width="370" height="20" rx="5" fill="#5C5E64" opacity="0.35"/>
  <rect x="988" y="448" width="4" height="20" rx="1" fill="#F97316"/>
  <text x="774" y="500" font-size="15" fill="#5C5E64">one line among tens of thousands of tokens</text>
  </g>
</svg>

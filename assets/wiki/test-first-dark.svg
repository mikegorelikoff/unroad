<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Test-first with an agent, in four turns. The agent writes a test list and you review the behaviour; it writes the test code and you check that the tests say what the list says; the red run must fail on its assertions, not on an import error, and then the tests are committed; the agent implements with the tests frozen until they pass, changing code only. An empty git diff on the tests folder proves the target did not move.">
  <title>Test-first with an agent, in four turns. The agent writes a test list and you review the behaviour; it writes the test code and you check that the tests say what the list says; the red run must fail on its assertions, not on an import error, and then the tests are committed; the agent implements with the tests frozen until they pass, changing code only. An empty git diff on the tests folder proves the target did not move.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="480" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">Test-first: a target the agent cannot move</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">You decide the behaviour; the agent does the mechanical parts.</text>
  <rect x="48" y="150" width="240" height="100" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="70" y="190" font-size="20" fill="#FAFAF9" font-weight="600">1  Test list</text>
  <text x="70" y="218" font-size="15" fill="#A1A1AA">plain language</text>
  <circle cx="54" cy="290" r="4" fill="#F97316"/>
  <text x="68" y="295" font-size="15" fill="#FAFAF9">You review: is this</text>
  <text x="68" y="317" font-size="15" fill="#FAFAF9">the behaviour we want?</text>
  <path d="M290 200.0 H325" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="328" y="150" width="240" height="100" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="350" y="190" font-size="20" fill="#FAFAF9" font-weight="600">2  Test code</text>
  <text x="350" y="218" font-size="15" fill="#A1A1AA">one test per line</text>
  <circle cx="334" cy="290" r="4" fill="#F97316"/>
  <text x="348" y="295" font-size="15" fill="#FAFAF9">You check: do the tests</text>
  <text x="348" y="317" font-size="15" fill="#FAFAF9">say what the list says?</text>
  <path d="M570 200.0 H605" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="608" y="150" width="240" height="100" rx="12" fill="#2B1417"/>
  <text x="630" y="190" font-size="20" fill="#F27A7F" font-weight="600">3  Red</text>
  <text x="630" y="218" font-size="15" fill="#FAFAF9">fails on its assertion</text>
  <circle cx="614" cy="290" r="4" fill="#F97316"/>
  <text x="628" y="295" font-size="15" fill="#FAFAF9">You confirm: not an import</text>
  <text x="628" y="317" font-size="15" fill="#FAFAF9">error, fixture or typo</text>
  <path d="M850 200.0 H899" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="912" y="150" width="240" height="100" rx="12" fill="#0E241E"/>
  <text x="934" y="190" font-size="20" fill="#4CC9A0" font-weight="600">4  Green</text>
  <text x="934" y="218" font-size="15" fill="#FAFAF9">code changes only</text>
  <circle cx="918" cy="290" r="4" fill="#F97316"/>
  <text x="932" y="295" font-size="15" fill="#FAFAF9">The agent stops when the</text>
  <text x="932" y="317" font-size="15" fill="#FAFAF9">focused tests pass</text>
  <rect x="866.0" y="166.0" width="18" height="14" rx="3" fill="#FAFAF9"/>
  <path d="M870.0 166.0 V161.0 A5 5 0 0 1 880.0 161.0 V166.0" fill="none" stroke="#FAFAF9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="875.0" y="124" font-size="15" fill="#FAFAF9" font-weight="600" text-anchor="middle">commit the tests</text>
  <rect x="902" y="136" width="260" height="128" rx="16" fill="none" stroke="#4CC9A0" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1156" y="126" font-size="15" fill="#4CC9A0" font-weight="600" text-anchor="end">tests frozen</text>
  <rect x="48" y="362" width="1104" height="80" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="72" y="394" font-size="16" fill="#FAFAF9" font-weight="600">After green, prove the target did not move</text>
  <text x="72" y="420" font-size="15"><tspan fill="#FB923C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">git diff --stat HEAD -- tests/</tspan><tspan fill="#A1A1AA">   prints nothing. If the agent keeps touching tests, block test edits with a hook or a deny rule.</tspan></text>
  </g>
</svg>

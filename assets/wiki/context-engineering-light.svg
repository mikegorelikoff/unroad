<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Two ways to give an agent context. Pasting everything, five source files and a 2,400-line test log, fills the window with noise, and the agent fixes the first suspicious thing it notices instead of the real bug. Just-in-time retrieval gives a few pointers, a function, a doc section and a reproduce command, and the agent loads only what it needs, finding the bug with a fraction of the context.">
  <title>Two ways to give an agent context. Pasting everything, five source files and a 2,400-line test log, fills the window with noise, and the agent fixes the first suspicious thing it notices instead of the real bug. Just-in-time retrieval gives a few pointers, a function, a doc section and a reproduce command, and the agent loads only what it needs, finding the bug with a fraction of the context.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C5E64"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F7A5F"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3263A"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C4C4BE"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B0B0C"/></marker></defs>
  <rect width="1200" height="560" fill="#FAFAF9"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#0B0B0C" font-weight="600" letter-spacing="-0.4">Point, do not paste</text>
  <text x="48" y="88" font-size="17" fill="#5C5E64">The smallest set of high-signal tokens that makes the right result likely.</text>
  <text x="48" y="138" font-size="20" fill="#0B0B0C" font-weight="600">Paste everything</text>
  <text x="48" y="164" font-size="15" fill="#5C5E64">five files and a 2,400-line test log, then “fix it”</text>
  <text x="624" y="138" font-size="20" fill="#0B0B0C" font-weight="600">Just-in-time retrieval</text>
  <text x="624" y="164" font-size="15" fill="#5C5E64">a few pointers; the agent reads what it needs</text>
  <rect x="48" y="186" width="528" height="250" rx="12" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="68" y="216" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">context window</text>
  <text x="556" y="216" font-size="15" fill="#B3263A" font-weight="600" text-anchor="end">nearly full</text>
  <rect x="68" y="232" width="116" height="64" rx="8" fill="#F3F3F0" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="81" y="256" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">invoice.ts</text>
  <rect x="81" y="268" width="90" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="81" y="278" width="66" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="192" y="232" width="134" height="64" rx="8" fill="#F3F3F0" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="205" y="256" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">proration.ts</text>
  <rect x="205" y="268" width="108" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="205" y="278" width="84" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="235" y="278" width="26" height="5" rx="2" fill="#F97316"/>
  <rect x="334" y="232" width="125" height="64" rx="8" fill="#F3F3F0" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="347" y="256" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">currency.ts</text>
  <rect x="347" y="268" width="99" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="347" y="278" width="75" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="467" y="232" width="89" height="64" rx="8" fill="#F3F3F0" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="480" y="256" font-size="15" fill="#5C5E64">+ 2 files</text>
  <rect x="480" y="268" width="63" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="480" y="278" width="39" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="68" y="308" width="488" height="108" rx="8" fill="#F3F3F0" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="84" y="334" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">test.log, 2,400 lines</text>
  <rect x="84" y="348" width="430" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="84" y="360" width="380" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="84" y="372" width="455" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="84" y="384" width="300" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="84" y="396" width="410" height="5" rx="2" fill="#E4E4E0"/>
  <rect x="48" y="458" width="528" height="64" rx="12" fill="#FBECEE"/>
  <path d="M70 484 L82 496 M82 484 L70 496" fill="none" stroke="#B3263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="486" font-size="16" fill="#B3263A" font-weight="600">Fixes the first suspicious thing it saw</text>
  <text x="100" y="508" font-size="15" fill="#0B0B0C">a currency format; the proration bug stays</text>
  <rect x="624" y="186" width="528" height="250" rx="12" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="644" y="216" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">context window</text>
  <text x="1132" y="216" font-size="15" fill="#0F7A5F" font-weight="600" text-anchor="end">mostly free</text>
  <rect x="644" y="230" width="488" height="84" rx="8" fill="#FFF1E6" stroke="#F97316" stroke-width="1.5"/>
  <text x="660" y="252" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">start from proration.ts, calculateProration</text>
  <text x="660" y="274" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">rule: docs/billing.md, section Proration</text>
  <text x="660" y="296" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">reproduce: npm test -- proration</text>
  <rect x="644" y="324" width="109" height="30" rx="8" fill="#F3F3F0"/>
  <text x="656" y="344.25" font-size="15" fill="#5C5E64">one function</text>
  <rect x="761" y="324" width="132" height="30" rx="8" fill="#F3F3F0"/>
  <text x="773" y="344.25" font-size="15" fill="#5C5E64">one doc section</text>
  <rect x="901" y="324" width="126" height="30" rx="8" fill="#F3F3F0"/>
  <text x="913" y="344.25" font-size="15" fill="#5C5E64">one failing test</text>
  <rect x="644" y="364" width="488" height="56" rx="8" fill="none" stroke="#C4C4BE" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="888.0" y="397" font-size="15" fill="#5C5E64" text-anchor="middle">free for the work</text>
  <rect x="624" y="458" width="528" height="64" rx="12" fill="#E6F3EE"/>
  <path d="M645 490 L649.6666666666666 494.9 L659 485.1" fill="none" stroke="#0F7A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="676" y="486" font-size="16" fill="#0F7A5F" font-weight="600">Finds the proration bug</text>
  <text x="676" y="508" font-size="15" fill="#0B0B0C">with a fraction of the context</text>
  </g>
</svg>

  <text x="378" y="354" font-size="15" fill="#4CC9A0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">quiz-complete</text>
  <path d="M624 150 H792" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <circle cx="598" cy="150" r="20" fill="#F97316"/>
  <text x="598" y="156" font-size="17" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">3</text>
  <text x="598" y="206" font-size="20" fill="#FAFAF9" font-weight="600" text-anchor="middle">Lab</text>
  <text x="598" y="232" font-size="15" fill="#A1A1AA" text-anchor="middle">Real files in your</text>
  <text x="598" y="253" font-size="15" fill="#A1A1AA" text-anchor="middle">own repository</text>
  <rect x="496" y="278" width="204" height="96" rx="12" fill="#0E241E"/>
  <path d="M591 300 L595.6666666666666 304.9 L605 295.1" fill="none" stroke="#4CC9A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="598" y="330" font-size="15" fill="#FAFAF9" font-weight="600" text-anchor="middle">lab checks pass on disk</text>
  <text x="598" y="354" font-size="15" fill="#4CC9A0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">lab-passes</text>
  <path d="M844 150 H1012" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <circle cx="818" cy="150" r="20" fill="#141416" stroke="#3F3F46" stroke-width="1.5"/>

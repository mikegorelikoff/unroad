  <text x="818" y="206" font-size="20" fill="#FAFAF9" font-weight="600" text-anchor="middle">Reflection</text>
  <text x="818" y="232" font-size="15" fill="#A1A1AA" text-anchor="middle">What you did and what</text>
  <text x="818" y="253" font-size="15" fill="#A1A1AA" text-anchor="middle">you will do differently</text>
  <rect x="716" y="278" width="204" height="96" rx="12" fill="#0E241E"/>
  <path d="M811 300 L815.6666666666666 304.9 L825 295.1" fill="none" stroke="#4CC9A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="818" y="330" font-size="15" fill="#FAFAF9" font-weight="600" text-anchor="middle">30+ characters</text>
  <text x="818" y="354" font-size="15" fill="#4CC9A0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">reflection-recorded</text>
  <circle cx="1038" cy="150" r="20" fill="#141416" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="1038" y="156" font-size="17" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">5</text>
  <text x="1038" y="206" font-size="20" fill="#FAFAF9" font-weight="600" text-anchor="middle">Review</text>
  <text x="1038" y="232" font-size="15" fill="#A1A1AA" text-anchor="middle">A short checklist</text>
  <text x="1038" y="253" font-size="15" fill="#A1A1AA" text-anchor="middle">you confirm honestly</text>
  <rect x="936" y="278" width="204" height="96" rx="12" fill="#0E241E"/>
  <path d="M1031 300 L1035.6666666666667 304.9 L1045 295.1" fill="none" stroke="#4CC9A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1038" y="330" font-size="15" fill="#FAFAF9" font-weight="600" text-anchor="middle">every item confirmed</text>
  <text x="1038" y="354" font-size="15" fill="#4CC9A0" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">checklist-complete</text>
  <text x="600" y="404" font-size="15" fill="#A1A1AA" text-anchor="middle">If a check fails you get the exact reason and stay on the step until it passes.</text>

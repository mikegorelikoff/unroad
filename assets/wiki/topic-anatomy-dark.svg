  <text x="158" y="206" font-size="20" fill="#FAFAF9" font-weight="600" text-anchor="middle">Lesson</text>
  <text x="158" y="232" font-size="15" fill="#A1A1AA" text-anchor="middle">Explained with your</text>
  <text x="158" y="253" font-size="15" fill="#A1A1AA" text-anchor="middle">project as the example</text>
  <rect x="56" y="278" width="204" height="96" rx="12" fill="#0E241E"/>
  <path d="M151 300 L155.66666666666666 304.9 L165 295.1" fill="none" stroke="#4CC9A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

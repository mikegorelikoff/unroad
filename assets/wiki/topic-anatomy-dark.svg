  <path d="M404 150 H572" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <circle cx="378" cy="150" r="20" fill="#141416" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="378" y="156" font-size="17" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">2</text>
  <text x="378" y="206" font-size="20" fill="#FAFAF9" font-weight="600" text-anchor="middle">Quiz</text>

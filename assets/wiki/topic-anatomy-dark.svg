<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="The five steps of every topic, in order, each checked in code before the next: lesson (the lesson was shown), quiz (every answer is correct), lab (the lab checks pass on disk), reflection (at least 30 characters in your own words) and review (every checklist item confirmed).">
  <title>The five steps of every topic, in order, each checked in code before the next: lesson (the lesson was shown), quiz (every answer is correct), lab (the lab checks pass on disk), reflection (at least 30 characters in your own words) and review (every checklist item confirmed).</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="430" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">Anatomy of a topic</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">Five steps. Each one is checked in code before the next one opens.</text>
  <path d="M158 150 H1038" fill="none" stroke="#3F3F46" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M184 150 H352" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="4 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <circle cx="158" cy="150" r="20" fill="#141416" stroke="#3F3F46" stroke-width="1.5"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-label="The four BMAD phases. Analysis, optional: brainstorming, forge idea, product brief and PRFAQ skills, writing brief.md, research.md and a PRFAQ. Planning: bmad-prd, bmad-ux and bmad-spec, writing prd.md, DESIGN.md, EXPERIENCE.md and SPEC.md. Solutioning: bmad-architecture, bmad-create-epics-and-stories and bmad-sprint-planning, writing ARCHITECTURE-SPINE.md, epics.md and sprint-status.yaml. Implementation: bmad-build, bmad-code-review, bmad-qa-generate-e2e-tests and bmad-retrospective, producing a spec per story, code and commits, and a retrospective. A small change goes straight to bmad-build, an epic-sized change runs bmad-spec and then one build per story, a multi-epic product uses the full path.">
  <title>The four BMAD phases. Analysis, optional: brainstorming, forge idea, product brief and PRFAQ skills, writing brief.md, research.md and a PRFAQ. Planning: bmad-prd, bmad-ux and bmad-spec, writing prd.md, DESIGN.md, EXPERIENCE.md and SPEC.md. Solutioning: bmad-architecture, bmad-create-epics-and-stories and bmad-sprint-planning, writing ARCHITECTURE-SPINE.md, epics.md and sprint-status.yaml. Implementation: bmad-build, bmad-code-review, bmad-qa-generate-e2e-tests and bmad-retrospective, producing a spec per story, code and commits, and a retrospective. A small change goes straight to bmad-build, an epic-sized change runs bmad-spec and then one build per story, a multi-epic product uses the full path.</title>

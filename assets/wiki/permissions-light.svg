<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Permissions and sandboxing. Every tool call is checked against three rule lists, deny first, then ask, then allow; the first match decides. Deny blocks the call, for example Read(./.env); ask prompts you, for example Bash(git push *); allow runs without asking, for example Bash(npm test *). Shell commands that run then stay inside an operating-system sandbox: writes only in the working directory, network only to allowed domains, and reads of paths such as ~/.ssh denied. Hooks, MCP servers and the built-in file and web tools run outside the sandbox and follow the permission rules.">
  <title>Permissions and sandboxing. Every tool call is checked against three rule lists, deny first, then ask, then allow; the first match decides. Deny blocks the call, for example Read(./.env); ask prompts you, for example Bash(git push *); allow runs without asking, for example Bash(npm test *). Shell commands that run then stay inside an operating-system sandbox: writes only in the working directory, network only to allowed domains, and reads of paths such as ~/.ssh denied. Hooks, MCP servers and the built-in file and web tools run outside the sandbox and follow the permission rules.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C5E64"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F7A5F"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3263A"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C4C4BE"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B0B0C"/></marker></defs>
  <rect width="1200" height="540" fill="#FAFAF9"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#0B0B0C" font-weight="600" letter-spacing="-0.4">Rules decide, the sandbox contains</text>
  <text x="48" y="88" font-size="17" fill="#5C5E64">Permission tiers choose what may run. The sandbox limits what a shell command can reach.</text>
  <rect x="48" y="248" width="180" height="96" rx="12" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="70" y="284" font-size="18" fill="#0B0B0C" font-weight="600">Tool call</text>
  <text x="70" y="310" font-size="15" fill="#5C5E64">from the model</text>
  <rect x="276" y="124" width="440" height="344" rx="12" fill="#F3F3F0" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="298" y="156" font-size="15" fill="#5C5E64">Checked in this order; first match decides</text>
  <rect x="298" y="176" width="396" height="80" rx="10" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <rect x="314" y="192" width="64" height="26" rx="7" fill="#FBECEE"/>
  <text x="346" y="210" font-size="15" fill="#B3263A" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">deny</text>
  <text x="392" y="211" font-size="16" fill="#0B0B0C" font-weight="600">blocked</text>
  <text x="314" y="240" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">Read(./.env)</text>
  <rect x="298" y="272" width="396" height="80" rx="10" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <rect x="314" y="288" width="64" height="26" rx="7" fill="#FFF1E6"/>
  <text x="346" y="306" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">ask</text>
  <text x="392" y="307" font-size="16" fill="#0B0B0C" font-weight="600">prompts you</text>
  <text x="314" y="336" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">Bash(git push *)</text>
  <rect x="298" y="368" width="396" height="80" rx="10" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <rect x="314" y="384" width="64" height="26" rx="7" fill="#E6F3EE"/>
  <text x="346" y="402" font-size="15" fill="#0F7A5F" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">allow</text>
  <text x="392" y="403" font-size="16" fill="#0B0B0C" font-weight="600">runs without asking</text>
  <text x="314" y="432" font-size="15" fill="#5C5E64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">Bash(npm test *)</text>
  <path d="M232 296 H273" fill="none" stroke="#5C5E64" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <path d="M736 210 L748 222 M748 210 L736 222" fill="none" stroke="#B3263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="756" y="221" font-size="15" fill="#B3263A" font-weight="600">stops</text>
  <path d="M694 216 H730" fill="none" stroke="#B3263A" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M694 312 H805" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
  <path d="M694 408 H805" fill="none" stroke="#0F7A5F" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-pass_)"/>
  <text x="722" y="302" font-size="15" fill="#C2410C">approved</text>
  <rect x="808" y="124" width="344" height="344" rx="14" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="830" y="160" font-size="19" fill="#0B0B0C" font-weight="600">Sandbox</text>
  <text x="830" y="184" font-size="15" fill="#5C5E64">an OS boundary around Bash commands</text>
  <rect x="830" y="212" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="846" y="238" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">writes</text>
  <text x="926" y="238" font-size="15" fill="#0B0B0C">working directory only</text>
  <rect x="830" y="264" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="846" y="290" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">network</text>
  <text x="926" y="290" font-size="15" fill="#0B0B0C">allowedDomains only</text>
  <rect x="830" y="316" width="300" height="40" rx="8" fill="#FFFFFF" stroke="#E4E4E0" stroke-width="1.2"/>
  <text x="846" y="342" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">reads</text>
  <text x="926" y="342" font-size="15" fill="#0B0B0C">denyRead: ~/.ssh, ~/.aws</text>
  <rect x="830" y="380" width="300" height="64" rx="10" fill="#0B0B0C"/>
  <text x="852" y="408" font-size="16" fill="#FAFAF9" font-weight="600">the command runs</text>
  <text x="852" y="430" font-size="15" fill="#A1A1AA">inside these limits</text>
  <text x="48" y="506" font-size="15" fill="#5C5E64">Outside the sandbox: hooks, MCP servers and the built-in file and web tools. They follow the permission rules.</text>
  </g>
</svg>

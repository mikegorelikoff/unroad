<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="The lethal trifecta for prompt injection: access to private data, exposure to untrusted content, and a way to communicate externally. With all three, injected text can make the agent read your data and send it out. Break any one leg and the attack fails: remove the way out with a sandbox and a narrow network allowlist, remove private data with narrow tokens and deny rules, or remove untrusted content by splitting sessions so a person reads the summary in between.">
  <title>The lethal trifecta for prompt injection: access to private data, exposure to untrusted content, and a way to communicate externally. With all three, injected text can make the agent read your data and send it out. Break any one leg and the attack fails: remove the way out with a sandbox and a narrow network allowlist, remove private data with narrow tokens and deny rules, or remove untrusted content by splitting sessions so a person reads the summary in between.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="540" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">The lethal trifecta</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">Private data, untrusted content and a way out. All three together turn injection into theft.</text>
  <path d="M330 168 L150 400" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M150 400 L510 400" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 168 L406.0 266.0" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M434.0 302.0 L510 400" fill="none" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="420.0" cy="284.0" r="15" fill="#2A1608" stroke="#F97316" stroke-width="2"/>
  <path d="M415.0 279.0 L425.0 289.0 M425.0 279.0 L415.0 289.0" fill="none" stroke="#FB923C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="446.0" y="290.0" font-size="15" fill="#FB923C" font-weight="600">break one leg</text>
  <rect x="212.0" y="129.0" width="236" height="78" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="330" y="164" font-size="18" fill="#FAFAF9" font-weight="600" text-anchor="middle">Private data</text>
  <text x="330" y="190" font-size="15" fill="#A1A1AA" text-anchor="middle">code, secrets, records</text>
  <rect x="32.0" y="361.0" width="236" height="78" rx="12" fill="#141416" stroke="#F27A7F" stroke-width="1.6"/>
  <text x="150" y="396" font-size="18" fill="#FAFAF9" font-weight="600" text-anchor="middle">Untrusted content</text>
  <text x="150" y="422" font-size="15" fill="#A1A1AA" text-anchor="middle">issues, web pages, docs</text>
  <rect x="392.0" y="361.0" width="236" height="78" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="510" y="396" font-size="18" fill="#FAFAF9" font-weight="600" text-anchor="middle">A way out</text>
  <text x="510" y="422" font-size="15" fill="#A1A1AA" text-anchor="middle">network, PRs, comments</text>
  <text x="330" y="318" font-size="15" fill="#F27A7F" font-weight="600" text-anchor="middle">all three:</text>
  <text x="330" y="340" font-size="15" fill="#F27A7F" font-weight="600" text-anchor="middle">data theft</text>
  <text x="688" y="144" font-size="17" fill="#FAFAF9" font-weight="600">Break one leg, the cheapest one for the task</text>
  <rect x="688" y="168" width="464" height="100" rx="12" fill="#2A1608" stroke="#F97316" stroke-width="1.6"/>
  <text x="710" y="200" font-size="17" fill="#FAFAF9" font-weight="600">Remove the way out</text>
  <text x="1130" y="200" font-size="15" fill="#FB923C" text-anchor="end">usually strongest</text>
  <text x="710" y="226" font-size="15" fill="#A1A1AA">sandbox with a narrow network allowlist;</text>
  <text x="710" y="247" font-size="15" fill="#A1A1AA">ask before git push and web fetch</text>
  <rect x="688" y="284" width="464" height="100" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="710" y="316" font-size="17" fill="#FAFAF9" font-weight="600">Remove private data</text>
  <text x="710" y="342" font-size="15" fill="#A1A1AA">a token that reads only this repository;</text>
  <text x="710" y="363" font-size="15" fill="#A1A1AA">deny rules for .env and secrets</text>
  <rect x="688" y="400" width="464" height="100" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="710" y="432" font-size="17" fill="#FAFAF9" font-weight="600">Remove untrusted content</text>
  <text x="710" y="458" font-size="15" fill="#A1A1AA">split sessions: one reads and summarises,</text>
  <text x="710" y="479" font-size="15" fill="#A1A1AA">you read the summary, a second one acts</text>
  <text x="48" y="512" font-size="15" fill="#A1A1AA">Review combinations: three harmless MCP servers can form the trifecta together.</text>
  </g>
</svg>

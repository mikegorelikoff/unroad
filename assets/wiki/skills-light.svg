<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="Progressive disclosure in Agent Skills. The name and description of every skill are always loaded. When a task matches a description, the body of that skill's SKILL.md loads, ideally under about 500 lines. Files in scripts, references and assets load only when the instructions point to them and the task needs them; a script's output enters the context, not its source.">
  <title>Progressive disclosure in Agent Skills. The name and description of every skill are always loaded. When a task matches a description, the body of that skill's SKILL.md loads, ideally under about 500 lines. Files in scripts, references and assets load only when the instructions point to them and the task needs them; a script's output enters the context, not its source.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C5E64"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F7A5F"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3263A"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C4C4BE"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B0B0C"/></marker></defs>
  <rect width="1200" height="540" fill="#FAFAF9"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#0B0B0C" font-weight="600" letter-spacing="-0.4">Skills load in three levels</text>
  <text x="48" y="88" font-size="17" fill="#5C5E64">Only names and descriptions are always in context; the rest loads when it is needed.</text>
  <circle cx="62" cy="136" r="14" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.5"/>
  <text x="62" y="141" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">1</text>
  <text x="88" y="142" font-size="19" fill="#0B0B0C" font-weight="600">Always loaded</text>
  <text x="48" y="172" font-size="15" fill="#5C5E64">name and description, every session</text>
  <circle cx="432" cy="136" r="14" fill="#F97316"/>
  <text x="432" y="141" font-size="15" fill="#FAFAF9" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">2</text>
  <text x="458" y="142" font-size="19" fill="#0B0B0C" font-weight="600">When triggered</text>
  <text x="418" y="172" font-size="15" fill="#5C5E64">the body of SKILL.md</text>
  <circle cx="882" cy="136" r="14" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.5"/>
  <text x="882" y="141" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600" text-anchor="middle">3</text>
  <text x="908" y="142" font-size="19" fill="#0B0B0C" font-weight="600">On demand</text>
  <text x="868" y="172" font-size="15" fill="#5C5E64">files the steps point to</text>
  <rect x="48" y="192" width="320" height="58" rx="10" fill="#FFF1E6" stroke="#F97316" stroke-width="1.8"/>
  <text x="64" y="216" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">release-notes</text>
  <text x="64" y="238" font-size="15" fill="#5C5E64">drafts release notes from commits</text>
  <rect x="48" y="260" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="64" y="284" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">db-migrate</text>
  <text x="64" y="306" font-size="15" fill="#5C5E64">adds a migration with a down step</text>
  <rect x="48" y="328" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="64" y="352" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">new-endpoint</text>
  <text x="64" y="374" font-size="15" fill="#5C5E64">scaffolds an endpoint our way</text>
  <rect x="48" y="396" width="320" height="58" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="64" y="420" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">pr-review</text>
  <text x="64" y="442" font-size="15" fill="#5C5E64">reviews a diff with a checklist</text>
  <path d="M372 221 C 394 221, 394 221, 415 221" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
  <rect x="418" y="192" width="400" height="262" rx="12" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="436" y="220" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">release-notes/SKILL.md</text>
  <path d="M436 236 H800" fill="none" stroke="#E4E4E0" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="436" y="266" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">1  run scripts/commits-since-tag.sh</text>
  <text x="436" y="296" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">2  group by Features, Fixes, Other</text>
  <text x="436" y="326" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">3  drop chore and ci commits</text>
  <text x="436" y="356" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">4  write RELEASE_NOTES.draft.md</text>
  <text x="436" y="396" font-size="15" fill="#C2410C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">for tone, read references/style.md</text>
  <text x="436" y="432" font-size="15" fill="#5C5E64">keep it under about 500 lines</text>
  <rect x="868" y="192" width="284" height="78" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="886" y="218" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">scripts/</text>
  <text x="886" y="240" font-size="15" fill="#5C5E64">it runs; only its output</text>
  <text x="886" y="260" font-size="15" fill="#5C5E64">enters the context</text>
  <rect x="868" y="282" width="284" height="78" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2"/>
  <text x="886" y="308" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">references/style.md</text>
  <text x="886" y="330" font-size="15" fill="#5C5E64">read when a step</text>
  <text x="886" y="350" font-size="15" fill="#5C5E64">points to it</text>
  <rect x="868" y="372" width="284" height="78" rx="10" fill="#FFFFFF" stroke="#C4C4BE" stroke-width="1.2" stroke-dasharray="4 5"/>
  <text x="886" y="398" font-size="15" fill="#0B0B0C" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="600">assets/</text>
  <text x="886" y="420" font-size="15" fill="#5C5E64">templates and data files</text>
  <path d="M802 266 C 836 266, 836 231, 865 231" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
  <path d="M802 391 C 836 391, 836 321, 865 321" fill="none" stroke="#F97316" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-accent)"/>
  <text x="48" y="508" font-size="15" fill="#5C5E64">The description decides when a skill loads, so it says what the skill does and when to use it.</text>
  </g>
</svg>

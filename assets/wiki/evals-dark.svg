<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-label="Building evals for an AI feature: collect real traces; do error analysis by reading them and noting pass or fail and the first thing that went wrong; group the notes into a small, counted failure taxonomy; fix the obvious failures directly; write code checks first and a validated LLM judge, one binary judge per failure mode, where no rule can decide; run them in CI whenever the prompt, model, retrieval or tools change, and read fresh traces again from time to time.">
  <title>Building evals for an AI feature: collect real traces; do error analysis by reading them and noting pass or fail and the first thing that went wrong; group the notes into a small, counted failure taxonomy; fix the obvious failures directly; write code checks first and a validated LLM judge, one binary judge per failure mode, where no rule can decide; run them in CI whenever the prompt, model, retrieval or tools change, and read fresh traces again from time to time.</title>
  <defs><marker id="ah-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A1A1AA"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F97316"/></marker><marker id="ah-pass_" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4CC9A0"/></marker><marker id="ah-fail" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F27A7F"/></marker><marker id="ah-strong" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3F3F46"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FAFAF9"/></marker></defs>
  <rect width="1200" height="452" fill="#0B0B0C"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" xml:space="preserve" style="white-space:pre">
  <text x="48" y="58" font-size="26" fill="#FAFAF9" font-weight="600" letter-spacing="-0.4">Evals start from your data</text>
  <text x="48" y="88" font-size="17" fill="#A1A1AA">Measure what does go wrong, not what you imagine might.</text>
  <rect x="48" y="128" width="196" height="236" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="66" y="162" font-size="18" fill="#FAFAF9" font-weight="600">Traces</text>
  <text x="66" y="190" font-size="15" fill="#A1A1AA">full records of real</text>
  <text x="66" y="211" font-size="15" fill="#A1A1AA">requests: input, prompt,</text>
  <text x="66" y="232" font-size="15" fill="#A1A1AA">tool calls, output</text>
  <path d="M246 178 H272" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="275" y="128" width="196" height="236" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="293" y="162" font-size="18" fill="#FAFAF9" font-weight="600">Error analysis</text>
  <text x="293" y="190" font-size="15" fill="#A1A1AA">read 30 to 100; note</text>
  <text x="293" y="211" font-size="15" fill="#A1A1AA">pass or fail and the</text>
  <text x="293" y="232" font-size="15" fill="#A1A1AA">first thing that broke</text>
  <path d="M473 178 H499" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="502" y="128" width="196" height="236" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="520" y="162" font-size="18" fill="#FAFAF9" font-weight="600">Failure taxonomy</text>
  <text x="520" y="190" font-size="15" fill="#A1A1AA">named failure modes,</text>
  <text x="520" y="211" font-size="15" fill="#A1A1AA">counted</text>
  <path d="M700 178 H726" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="729" y="128" width="196" height="236" rx="12" fill="#2A1608" stroke="#F97316" stroke-width="2"/>
  <text x="747" y="162" font-size="18" fill="#FAFAF9" font-weight="600">Evaluators</text>
  <path d="M927 178 H953" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="956" y="128" width="196" height="236" rx="12" fill="#141416" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="974" y="162" font-size="18" fill="#FAFAF9" font-weight="600">CI</text>
  <text x="974" y="190" font-size="15" fill="#A1A1AA">rerun when the prompt,</text>
  <text x="974" y="211" font-size="15" fill="#A1A1AA">model, retrieval or</text>
  <text x="974" y="232" font-size="15" fill="#A1A1AA">tools change</text>
  <rect x="66" y="268" width="150" height="6" rx="3" fill="#27272A"/>
  <rect x="66" y="284" width="120" height="6" rx="3" fill="#27272A"/>
  <rect x="66" y="300" width="140" height="6" rx="3" fill="#27272A"/>
  <rect x="66" y="316" width="96" height="6" rx="3" fill="#27272A"/>

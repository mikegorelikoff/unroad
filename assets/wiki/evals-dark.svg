  <rect x="520" y="251" width="99" height="14" rx="4" fill="#A1A1AA" opacity="0.35"/>
  <text x="627" y="263" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">11</text>
  <rect x="520" y="275" width="81" height="14" rx="4" fill="#A1A1AA" opacity="0.35"/>
  <text x="609" y="287" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">9</text>
  <rect x="520" y="299" width="54" height="14" rx="4" fill="#A1A1AA" opacity="0.35"/>
  <text x="582" y="311" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">6</text>
  <text x="520" y="342" font-size="15" fill="#FB923C" font-weight="600">fix the obvious directly</text>
  <rect x="743" y="178" width="168" height="68" rx="10" fill="#141416" stroke="#27272A" stroke-width="1.2"/>
  <text x="757" y="204" font-size="15" fill="#FAFAF9" font-weight="600">code checks first</text>
  <text x="757" y="226" font-size="15" fill="#A1A1AA">schema, tool args</text>
  <rect x="743" y="256" width="168" height="92" rx="10" fill="#141416" stroke="#27272A" stroke-width="1.2"/>
  <text x="757" y="282" font-size="15" fill="#FAFAF9" font-weight="600">then an LLM judge</text>
  <text x="757" y="304" font-size="15" fill="#A1A1AA">one failure mode,</text>
  <text x="757" y="326" font-size="15" fill="#A1A1AA">binary, validated</text>
  <rect x="970" y="278" width="168" height="66" rx="10" fill="#18181B" stroke="#27272A" stroke-width="1.2"/>
  <text x="984" y="304" font-size="15" fill="#FAFAF9" font-weight="600">a few dozen</text>
  <text x="984" y="326" font-size="15" fill="#A1A1AA">high-value cases</text>
  <path d="M1054.0 368 V412 H146.0 V367" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-muted)"/>
  <rect x="344.8999999999998" y="398" width="510.2000000000004" height="28" rx="6" fill="#0B0B0C"/>
  <text x="600" y="417" font-size="15" fill="#A1A1AA" text-anchor="middle">read fresh traces again: that is where the next failure mode shows up</text>

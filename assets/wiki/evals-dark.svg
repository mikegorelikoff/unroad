  <text x="293" y="278" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">t_0041</text>
  <path d="M370 268 L380 278 M380 268 L370 278" fill="none" stroke="#F27A7F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="293" y="304" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">t_0042</text>
  <path d="M370 299 L373.3333333333333 302.5 L380 295.5" fill="none" stroke="#4CC9A0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="293" y="330" font-size="15" fill="#A1A1AA" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace">t_0043</text>
  <path d="M370 320 L380 330 M380 320 L370 330" fill="none" stroke="#F27A7F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="520" y="227" width="126" height="14" rx="4" fill="#F97316" opacity="0.9"/>

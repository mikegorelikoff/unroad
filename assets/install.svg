<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img" aria-label="Terminal: the unroad installer">
  <rect width="1000" height="452" rx="14" fill="#141416"/>
  <circle cx="26" cy="24" r="6" fill="#3F3F46"/><circle cx="46" cy="24" r="6" fill="#3F3F46"/><circle cx="66" cy="24" r="6" fill="#3F3F46"/>
  <g xml:space="preserve" style="white-space:pre" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#E4E4E7">
    <text xml:space="preserve" x="28" y="66"><tspan fill="#A1A1AA">$</tspan> curl -fsSL https://github.com/mikegorelikoff/unroad/releases/latest/download/install.sh | sh</text>
    <text xml:space="preserve" x="28" y="104"><tspan fill="#FB923C" font-weight="700">unroad</tspan> <tspan fill="#A1A1AA">installer</tspan></text>
    <text xml:space="preserve" x="28" y="126" fill="#A1A1AA">skills that teach you to build with AI agents</text>
    <text xml:space="preserve" x="28" y="164"><tspan fill="#A1A1AA">›</tspan> <tspan fill="#A1A1AA">platform  </tspan> aarch64-apple-darwin</text>
    <text xml:space="preserve" x="28" y="186"><tspan fill="#A1A1AA">›</tspan> <tspan fill="#A1A1AA">release   </tspan> v0.1.1</text>
    <text xml:space="preserve" x="28" y="208"><tspan fill="#4CC9A0">✓</tspan> <tspan fill="#A1A1AA">checksums </tspan> SHA256SUMS</text>
    <text xml:space="preserve" x="28" y="230"><tspan fill="#4CC9A0">✓</tspan> <tspan fill="#A1A1AA">ur        </tspan> unroad 0.1.1 → ~/.local/bin/ur</text>
    <text xml:space="preserve" x="28" y="252"><tspan fill="#4CC9A0">✓</tspan> <tspan fill="#A1A1AA">web       </tspan> → ~/.unroad/web</text>
    <text xml:space="preserve" x="28" y="274"><tspan fill="#4CC9A0">✓</tspan> <tspan fill="#A1A1AA">skills    </tspan> 6 skills → ~/.claude/skills</text>
    <text xml:space="preserve" x="28" y="296"><tspan fill="#4CC9A0">✓</tspan> <tspan fill="#A1A1AA">node      </tspan> v22.11.0 for the web app</text>
    <text xml:space="preserve" x="28" y="334" font-weight="700">Next</text>
    <text xml:space="preserve" x="28" y="358" fill="#A1A1AA">  Open your agent in a repository you work on and type:</text>
    <text xml:space="preserve" x="28" y="380"><tspan fill="#FB923C">    /ur-start</tspan><tspan fill="#A1A1AA">   set up your goal, level and lab repository</tspan></text>
    <text xml:space="preserve" x="28" y="402"><tspan fill="#FB923C">    /ur-learn</tspan><tspan fill="#A1A1AA">   learn the next topic</tspan></text>
      <text xml:space="preserve" x="28" y="424"><tspan fill="#FB923C">    /ur-gui</tspan><tspan fill="#A1A1AA">     open the roadmap in your browser</tspan></text>
  </g>
</svg>
